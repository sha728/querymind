name: CI

# Design §13.5 (N4): every pull request runs all four jobs. Spider data and real LLMs are never
# used: the e2e job swaps the model for e2e/stub-llm, and secrets are generated per run.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (lint + tests, with Northwind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QM_REQUIRE_TARGET_DB: "1" # integration tests fail instead of skipping
    steps:
      - uses: actions/checkout@v7

      - name: Start Northwind (read-only role, date shift)
        run: |
          bash scripts/ci_env.sh
          docker compose up -d --wait target-db

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: engine
        run: ruff check .

      - name: Ruff format
        working-directory: engine
        run: ruff format --check .

      - name: Pytest
        working-directory: engine
        run: pytest

      - name: Read-only role checks
        run: bash db/target/check_readonly.sh

  api:
    name: api (build + xUnit, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build (warnings are errors)
        run: dotnet build QueryMind.sln -warnaserror

      - name: Test
        run: dotnet test QueryMind.sln --no-build

  frontend:
    name: frontend (lint + types + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run

  e2e:
    name: e2e (full stack + stub LLM, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack with the stub LLM
        run: |
          bash scripts/ci_env.sh
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Happy path
        working-directory: e2e
        run: npx playwright test

      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > e2e/compose.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
            e2e/compose.log
          if-no-files-found: ignore
          retention-days: 7
