[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qm-engine"
version = "0.1.0"
description = "QueryMind text-to-SQL engine and Spider evaluation harness"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Pinned exactly: safety/forbidden.py depends on sqlglot node class names (design §7.2).
    "sqlglot==30.21.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[project.scripts]
# qm_eval (engine/eval/qm_eval) is added to the wheel when its CLI exists (T17).
qm-eval = "qm_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qm_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
