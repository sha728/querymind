# QueryMind frontend (design §14.1): serves the built SPA and proxies the API.
# Runs as non-root (nginx-unprivileged), listening on 8080.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 16k;  # requests are small JSON (a question is <= 1,000 chars)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Container liveness for the compose healthcheck: nginx itself, no upstream.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Whole-stack health (api + app DB + engine) and the public API go to the .NET service.
    location = /health {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params.conf;
        # The api waits up to 90 s for the engine (design §12), plus free-tier pacing.
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/history, /schema, ...) all serve the SPA shell, never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
