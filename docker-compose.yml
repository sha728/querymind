# QueryMind: the full stack (design §14.1). `docker compose up` starts all five services; open
# http://localhost:8080. Values come from .env (copy .env.example). Container-network addresses
# are set here (design E9). Ollama runs on the host (embeddings; see README).

services:
  target-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${TARGET_DB_NAME:-northwind}
      POSTGRES_USER: northwind_owner
      POSTGRES_PASSWORD: ${TARGET_DB_OWNER_PASSWORD:?set TARGET_DB_OWNER_PASSWORD in .env}
      TARGET_DB_RO_USER: ${TARGET_DB_RO_USER:-querymind_ro}
      TARGET_DB_RO_PASSWORD: ${TARGET_DB_RO_PASSWORD:?set TARGET_DB_RO_PASSWORD in .env}
    ports:
      # Loopback only: reachable from this machine for host-run tests, never from the network.
      - "127.0.0.1:${TARGET_DB_PORT:-5433}:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
      - ./db/target/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind_owner -d ${TARGET_DB_NAME:-northwind}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-querymind}
      POSTGRES_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    # No published port: only the api service reaches it. Tables come from the api's EF Core
    # migrations (design §5.1), applied when the api starts.
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build: ./engine
    env_file: .env
    environment:
      # Container-network addresses override the host values in .env (design §14.1, E9).
      # Hosted LLM providers (cerebras, groq) need no override; Ollama runs on the host.
      QM_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      QM_EMBED_BASE_URL: http://host.docker.internal:11434/v1
      TARGET_DB_HOST: target-db
      TARGET_DB_PORT: "5432"
      ENGINE_CACHE_DIR: /app/.engine_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No published port: only the api service (and `docker compose exec`) reach it.
    volumes:
      - engine-cache:/app/.engine_cache
    depends_on:
      target-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    build: ./api
    # Only what the api needs is passed in (not the whole .env: no LLM or target-DB secrets).
    environment:
      APP_DB_HOST: app-db
      APP_DB_NAME: ${APP_DB_NAME:-querymind}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (at least 32 bytes)}
      JWT_ISSUER: ${JWT_ISSUER:-querymind}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-querymind}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ENGINE_BASE_URL: http://engine:8000
      ENGINE_INTERNAL_KEY: ${ENGINE_INTERNAL_KEY:?set ENGINE_INTERNAL_KEY in .env}
    # No published port: the frontend's nginx proxies /api and /health to it.
    depends_on:
      app-db:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      # 200 when Healthy or Degraded (engine down), 503 when the app DB is unreachable.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      # The only published port. Loopback only by default; set FRONTEND_BIND=0.0.0.0 to expose it.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  app-db-data:
  target-db-data:
  engine-cache:
